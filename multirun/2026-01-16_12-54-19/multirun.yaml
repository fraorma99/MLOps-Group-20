hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - wandb.project=mlops_group_20
    - wandb.run_name=lr_${optimizer.lr}
  job:
    name: train
    chdir: false
    override_dirname: wandb.project=mlops_group_20,wandb.run_name=lr_${optimizer.lr}
    id: ???
    num: ???
    config_name: sweep
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/kenzomaetanimachholm/Desktop/DTU/Jan2026/MLOps-Group-20
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/kenzomaetanimachholm/Desktop/DTU/Jan2026/MLOps-Group-20/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
data:
  path: data/processed/processed.pkl
  splits_dir: data/splits
  seed: 42
  split:
    train_size: 0.7
    val_size: 0.15
    test_size: 0.15
    stratify_column: Language
  vocab_min_freq: 2
  max_len: 200
model:
  name: LanguageClassifier
  embed_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.3
training:
  batch_size: 64
  num_epochs: 10
  device: auto
  save_best_to: models/best_model.pt
  save_history_to: models/training_history.pt
optimizer:
  name: adam
  lr:
  - 0.001
  - 0.0015
  - 0.002
  weight_decay: 0.0
scheduler:
  name: reduce_on_plateau
  mode: min
  patience: 2
  factor: 0.5
wandb:
  enabled: true
  project: mlops_group_20
  entity: kenzodtu-danmarks-tekniske-universitet-dtu
  run_name: lr_${optimizer.lr}
  notes: null
  tags: []
  watch_model: false
  log_freq: 100
