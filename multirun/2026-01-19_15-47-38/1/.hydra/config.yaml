data:
  path: data/processed/processed.pkl
  splits_dir: data/splits
  seed: 42
  split:
    train_size: 0.7
    val_size: 0.15
    test_size: 0.15
    stratify_column: Language
  vocab_min_freq: 2
  max_len: 200
model:
  name: LanguageClassifier
  embed_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.3
training:
  batch_size: 64
  num_epochs: 10
  device: auto
  save_best_to: models/best_model.pt
  save_history_to: models/training_history.pt
optimizer:
  name: adam
  lr: 0.0015
  weight_decay: 0.0
scheduler:
  name: reduce_on_plateau
  mode: min
  patience: 2
  factor: 0.5
wandb:
  enabled: true
  project: mlops_group_20
  entity: raulalcazarrr-danmarks-tekniske-universitet-dtu
  api_key: ${oc.env:WANDB_API_KEY, null}
  run_name: lr_${optimizer.lr}
  notes: null
  tags: []
  watch_model: false
  log_freq: 100
