services:
  api:
    image: kenzodtu/prometheus:kenzothorv1
    container_name: mlops-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data/splits:/app/data/splits:ro
    environment:
      - ENABLE_METRICS=true

  prometheus:
    image: prom/prometheus:latest
    container_name: mlops-prometheus-server
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - api
networks:
  default:
    driver: bridge
