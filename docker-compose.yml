services:
  prometheus:
    image: kenzodtu/prometheus:latest
    container_name: mlops-prometheus
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - ./models:/app/models:ro
      - ./data/splits:/app/data/splits:ro
    environment:
      - ENABLE_METRICS=true

networks:
  default:
    driver: bridge
