[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "mlops_group_20"
version = "0.0.1"
description = "machine learning operations assignments s"
authors = [
  { name = "group_20", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bentoml>=1.4.33",
    "cookiecutter>=2.6.0",
    "dvc>=3.66.1",
    "dvc-gs>=3.0.2",
    "evidently>=0.7.20",
    "fastapi==0.115.6",
    "google-cloud-storage>=3.8.0",
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "kaggle>=1.8.3",
    "loguru>=0.7.3",
    "locust>=2.43.1",
    "markdown>=3.10",
    "matplotlib>=3.10.8",
    "netron>=8.8.3",
    "numpy==2.4.1",
    "onnx>=1.20.1",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.5.7",
    "pandas>=2.3.3",
    "pytz>=2024.1",
    "tzdata>=2023.3",
    "pydantic>=2.12.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch==2.6.0",
    "torchaudio>=2.6.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.21.0",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "wandb>=0.24.0",
    "pytest-cov>=6.3.0",
]

[dependency-groups]
dev = [
    "coverage==7.13.1",
    "invoke==2.2.0",
    "mkdocs-material==9.4.6",
    "mkdocs==1.6.1",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mkdocstrings-python==1.12.2",
    "docker>=7.1.0",
    "snakeviz>=2.2.2",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]

[tool.setuptools]
packages = ["mlops_group_20"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv]
package = true
