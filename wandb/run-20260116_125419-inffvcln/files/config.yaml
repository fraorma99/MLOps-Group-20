data:
    value:
        max_len: 200
        path: data/processed/processed.pkl
        seed: 42
        split:
            stratify_column: Language
            test_size: 0.15
            train_size: 0.7
            val_size: 0.15
        splits_dir: data/splits
        vocab_min_freq: 2
model:
    value:
        dropout: 0.3
        embed_dim: 128
        hidden_dim: 256
        name: LanguageClassifier
        num_layers: 2
optimizer:
    value:
        lr:
            - 0.001
            - 0.0015
            - 0.002
        name: adam
        weight_decay: 0
scheduler:
    value:
        factor: 0.5
        mode: min
        name: reduce_on_plateau
        patience: 2
training:
    value:
        batch_size: 64
        device: auto
        num_epochs: 10
        save_best_to: models/best_model.pt
        save_history_to: models/training_history.pt
wandb:
    value:
        enabled: true
        entity: kenzodtu-danmarks-tekniske-universitet-dtu
        log_freq: 100
        notes: null
        project: mlops_group_20
        run_name: lr_[0.001, 0.0015, 0.002]
        tags: []
        watch_model: false
