##Hydra configuration for training LanguageClassifier + Wandb

#Keep working directory stable so existing relative paths work
hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

#data-related configuration
data:
  path: data/processed/processed.pkl
  splits_dir: data/splits
  seed: 42
  split:
    #Equivalent to test_size=0.3, then split remaining 0.3 equally into val/test
    train_size: 0.7
    val_size: 0.15
    test_size: 0.15
    stratify_column: Language
  vocab_min_freq: 2
  max_len: 200  #sequence length for TextDataset

#Model hyperparameters
model:
  name: LanguageClassifier
  embed_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.3

#Training configuration
training:
  batch_size: 64
  num_epochs: 10
  device: auto  #auto | cpu | cuda | mps
  save_best_to: models/best_model.pt
  save_history_to: models/training_history.pt

#Optimizer configuration
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0

#Scheduler configuration
scheduler:
  name: reduce_on_plateau
  mode: min
  patience: 2
  factor: 0.5

#Weights & Biases configuration
wandb:
  enabled: true
  project: "mlops_group_20"
  entity: "fra-orma99-danmarks-tekniske-universitet-dtu"
  api_key: ${oc.env:WANDB_API_KEY, null} 
  run_name: null
  notes: null
  tags: []
  watch_model: false
  log_freq: 100

