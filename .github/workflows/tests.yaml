name: Unit Tests (matrix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run ruff (lint)
        run: uvx ruff check .

  test:
    name: Tests (os=${{ matrix.os }}, py=${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
        experimental: [false]
        include:
          - python: "3.13"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --dev --locked

      - name: PyTorch smoke check
        run: uv run python -c "import torch; print('torch', torch.__version__)"

      - name: Run tests
        run: uv run pytest -v tests/
